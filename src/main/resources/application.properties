# ============================================================
# Server Configuration
# ============================================================
server.port=8081

# ============================================================
# PostgreSQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/agroo_db
spring.datasource.username=postgres
spring.datasource.password=1041
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA/Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=agrooSecretKey2024ForAgriculturalAppWithSecure256BitKeyForJWT
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================================
# Email Configuration (for OTP)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sudeesharavisara2@gmail.com
spring.mail.password=epem thtw blnd opbx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ============================================================
# OTP Configuration
# ============================================================
otp.expiration-minutes=10
otp.length=6

# ============================================================
# Logging
# ============================================================
logging.level.com.agroo.agroo=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================================
# File Storage Configuration
# ============================================================
file.upload-dir=uploads/products

# ============================================================
# Static Resources - Add uploads folder
# ============================================================
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/,file:uploads/

# ============================================================
# File Upload Configuration
# ============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB

# ============================================================
# Media file types
# ============================================================
media.allowed.image-types=image/jpeg,image/png,image/jpg,image/gif,image.webp
media.allowed.video-types=video/mp4,video/webm,video/ogg

# ============================================================
# AI Chatbot Configuration
# ============================================================
# OpenAI API (Get from https://platform.openai.com/api-keys)
# Leave empty to use fallback responses
openai.api.key=
openai.api.url=https://api.openai.com/v1/chat/completions

# ============================================================
# WebClient Configuration
# ============================================================
spring.webflux.max-in-memory-size=2MB

# ============================================================
# CORS Configuration (if needed)
# ============================================================
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ============================================================
# Actuator (Optional - for monitoring)
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always