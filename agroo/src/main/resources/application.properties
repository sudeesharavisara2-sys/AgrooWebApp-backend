# ============================================================
# PostgreSQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/agroo_db
spring.datasource.username=postgres
spring.datasource.password=1041
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA/Hibernate Configuration
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================================
# JWT Configuration (for security)
# ============================================================
jwt.secret=agrooSecretKey2024ForAgriculturalApp
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================================
# Logging
# ============================================================
logging.level.com.agroo.agroo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# ============================================================
# File Upload Configuration
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# CORS Configuration (for frontend)
# ============================================================
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true